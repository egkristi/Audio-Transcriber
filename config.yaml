# Audio-Transcriber Configuration

# Audio Analysis Settings
analysis:
  vad_model: "silero"  # Voice Activity Detection model
  language_detection: true
  extract_metadata: true

# Audio Preprocessing Settings
preprocessing:
  target_sample_rate: 16000
  target_channels: 1  # Mono
  high_pass_filter_hz: 80
  low_pass_filter_hz: 8000
  loudness_target_lufs: -20
  loudness_algorithm: "ITU-R BS.1770-4"
  denoising: false  # Disabled by default; enable only for high background noise
  denoising_strength: 0.5

# Speaker Diarization Settings
diarization:
  model: "pyannote/speaker-diarization-3.1"
  # NOTE: pyannote/speaker-diarization-3.1 bundles its own segmentation model.
  # The segmentation model is NOT configurable via this config file.
  min_speakers: null  # Auto-detect if null
  max_speakers: null  # Auto-detect if null
  num_speakers_override: null  # Set to specific number for 2-party conversations (e.g., 2)
  threshold: 0.5
  min_duration_on: 0.02
  min_duration_off: 0.02

# Transcription Models
transcription:
  primary_model: "NbAiLab/nb-whisper-large-verbatim"  # Verbatim/exact transcription
  secondary_model: "openai/whisper-large-v3"  # For comparison (Step 4)
  fallback_model: "NbAiLab/nb-whisper-large"  # Grammatically corrected version
  
  # Whisper settings
  beam_size: 10
  best_of: 5
  patience: 1.0
  length_penalty: 1.0
  
  # Feature flags
  word_timestamps: true  # ALWAYS true for editor synchronization
  vad_filter: true  # Filter silence before transcription
  condition_on_previous_text: true  # Use context from previous segments
  max_segment_duration: 15  # Max segment duration in seconds. Longer segments are split to reduce stuttering/repetition. Default 15s (was 30s, see #40).
  # NOTE: Post-processing split (_split_long_segments) is COUNTERPRODUCTIVE —
  # it increases WER by dividing already-stuttered output into more pieces.
  # The real fix is VAD chunk_size at model-load time (see vad_options below).
  # Set to 0 to disable post-processing split entirely.
  language: "no"  # Norwegian
  
  # Hotwords for faster-whisper — improves recognition of rare/technical terms
  # by prepending them to the decoder prompt. Comma-separated string.
  # More effective than initial_prompt for boosting specific words.
  # (See ISSUES.md #41, #43)
  hotwords: null  # Set to e.g. "Markus, Vilde, Elise, Knut, WhatsApp" for specific names
  
  # VAD options passed to whisperx.load_model() — controls VAD merging BEFORE
  # transcription. Default chunk_size=30s causes stuttering in conversational
  # speech. Setting chunk_size=10 produces shorter VAD-merged segments that
  # reduce stuttering at the source. (See ISSUES.md #40, #44)
  vad_options:
    chunk_size: 25  # Seconds. Lower = shorter segments, less stuttering
    vad_onset: 0.500  # VAD activation threshold
    vad_offset: 0.363  # VAD deactivation threshold
  
  # Confidence thresholds — AGGRESSIVE for maximum flagging without ground truth
  low_confidence_threshold: 0.70  # Lower = flag more segments
  confidence_percentile: 25       # Lower = flag more segments
  alignment_threshold: 0.50        # Lower = flag more alignment issues
  logprob_threshold: -0.3         # Higher = flag more low-confidence
  no_speech_threshold: 0.3        # Lower = flag more hallucination risk
  compression_threshold: 2.0     # Lower = flag more repetition
  
  # Review list settings
  review_list_top_n: null        # null = export ALL segments (not just top 20)
  review_list_export_json: true   # Export full signal data for analysis

# Model Comparison Settings (Step 5)
comparison:
  alignment_method: "wer"  # Word Error Rate style diff
  flag_low_confidence: true
  flag_disagreement: true
  min_agreement_score: 0.95

# Batch Processing Settings
batch:
  max_workers: 4
  chunk_size: 10  # Number of files per worker
  timeout_per_file: 3600  # Seconds (1 hour max per file)

# Output Settings
output:
  format: "srt"  # srt or json
  include_confidence: true
  include_speaker_labels: true
  export_intermediates: false  # Save intermediate stages (diarization, model 1 vs 2)

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json or text
  save_to_file: true
  log_dir: "./logs"
  max_log_size_mb: 100
  backup_count: 5

# Performance & Optimization
performance:
  device: "cpu"  # cpu, cuda, mps (Metal Performance Shaders for Apple Silicon)
  compute_type: "int8"  # int8, float16, float32
  device_index: 0  # GPU device index (if CUDA)
  
# Spell-checking (Optional, Phase 5)
spell_check:
  enabled: false
  language: "no"  # Norwegian
  model: "symspellpy"  # or "transformers" for more accuracy

# Custom vocabulary (Optional, Phase 5)
vocabulary:
  custom_words_file: null  # Path to JSON file with {word: context} pairs
  use_initial_prompt: true  # Inject vocabulary into Whisper's initial_prompt
