[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber"
version = "0.1.39"
description = "Norwegian audio transcription system with speaker diarization and multi-model comparison"
requires-python = ">=3.11"
authors = [
    { name = "Erling Kristiansen", email = "erling@example.com" }
]
license = { text = "MIT" }

dependencies = [
    "whisperx>=3.0.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.30.0",
    "librosa>=0.10.0",
    "scipy>=1.11.0",
    "pytest>=7.0.0",
    "jiwer>=3.0.0",
    "pyloudnorm>=0.2.0",
    "symspellpy>=6.7.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
repository = "https://github.com/egkristi/Audio-Transcriber"
